name: ChommieHub CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend
        run: >
          dotnet restore
          backend/ChommieHub.Api/ChommieHub.Api.slnx

      - name: Build backend
        run: >
          dotnet build
          backend/ChommieHub.Api/ChommieHub.Api.slnx
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >
          dotnet test
          backend/ChommieHub.Api/ChommieHub.Api.slnx
          --configuration Release
          --no-build
          --verbosity normal


  android:
    name: Android Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android/ChommieHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android debug APK
        run: ./gradlew assembleDebug